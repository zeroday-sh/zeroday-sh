<svg width="370" height="240" xmlns="http://www.w3.org/2000/svg">
  <style>
    .ascii {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      fill: #58a6ff;
      white-space: pre;
    }
    @keyframes typing {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .line { animation: typing 0.3s forwards; opacity: 0; }
  </style>
  <rect width="100%" height="100%" fill="#0d1117" rx="8" stroke="#30363d" stroke-width="1"/>
  <text x="25" y="45" class="ascii">
    <tspan x="25" dy="0" class="line" style="animation-delay: 0.1s;">  ______ _____ ____  ____   _ __   __</tspan>
    <tspan x="25" dy="16" class="line" style="animation-delay: 0.2s;"> |__  /| ____|  _ \/ ___| | |\ \ / /</tspan>
    <tspan x="25" dy="16" class="line" style="animation-delay: 0.3s;">   / / |  _| | |_) | |  | | | \ V / </tspan>
    <tspan x="25" dy="16" class="line" style="animation-delay: 0.4s;">  / /_ | |___|  _ &lt;| |__| |_|  | |  </tspan>
    <tspan x="25" dy="16" class="line" style="animation-delay: 0.5s;"> /____|_____|_| \_\_____\___/  |_|  </tspan>
    <tspan x="25" dy="24" class="line" style="animation-delay: 0.7s; fill: #7ee787;"> [!] Exploiting the unknown</tspan>
    <tspan x="25" dy="18" class="line" style="animation-delay: 0.9s; fill: #8b949e;"> [~] Terminal initialized...</tspan>
    <tspan x="25" dy="18" class="line" style="animation-delay: 1.1s; fill: #8b949e;"> [✓] Ready for deployment</tspan>
  </text>
</svg>